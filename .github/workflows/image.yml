name: Image

# Publica la imagen en GHCR: Coolify solo hace pull, así el build (2,4 GB de descarga
# del modelo + ~3 GB de RAM para la conversión) no corre en el servidor de despliegue.
#
# Requisito único: el paquete GHCR debe ser visible para el servidor de Coolify. Si el
# repositorio es privado, en GitHub → Settings → Packages se le da acceso al token que
# use Coolify como registry.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR exige el nombre en minúsculas y `github.repository` conserva el caso original.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: repo
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # El modelo convertido (~600 MB) y torch son capas estables: con la caché, un
          # cambio de código no vuelve a descargar los 2,4 GB de Hugging Face.
          cache-from: type=gha
          cache-to: type=gha,mode=max
