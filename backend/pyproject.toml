[project]
name = "nllb-api"
version = "0.1.0"
description = "API de traducción es → en/pt/de/fr/it con NLLB-200 (CTranslate2 int8, solo CPU)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctranslate2>=4.5,<5",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "sentencepiece>=0.2,<1",
    "starlette>=0.46,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]
# Solo para convertir el modelo en el build; el runtime no necesita torch.
convert = [
    "accelerate>=1.2",
    "torch>=2.5",
    "transformers>=4.47,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nllb_api"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["model: requiere el modelo convertido (MODEL_DIR)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ctranslate2", "sentencepiece", "huggingface_hub"]
ignore_missing_imports = true
